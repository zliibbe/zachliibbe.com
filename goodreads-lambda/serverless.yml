service: goodreads-scraper

useDotenv: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3003
    host: "localhost"

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    NODE_ENV: ${opt:stage, 'dev'}
    GOODREADS_EMAIL: ${env:GOODREADS_EMAIL, ''}
    GOODREADS_PASSWORD: ${env:GOODREADS_PASSWORD, ''}
    GOODREADS_USER_ID: ${env:GOODREADS_USER_ID, ''}

functions:
  getCurrentlyReading:
    handler: handler.getCurrentlyReading
    events:
      - http:
          method: GET
          path: getCurrentlyReading
          cors: true
    timeout: 60
    memorySize: 2048
    url: true
    environment:
      NODE_ENV: ${opt:stage, 'dev'}

# Remove the plugins section and use built-in esbuild
build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - "@playwright/test"
      - "playwright-core"
    platform: "node"
    target: "node18"
    external:
      - "fsevents"
      - "@playwright/test"
      - "playwright-core"
