service: goodreads-lambda

provider:
  name: aws
  runtime: nodejs18.x
  region: ${env:AWS_REGION, 'us-east-1'}
  environment:
    GOODREADS_USER_ID: ${env:GOODREADS_USER_ID, '24890536'}
  stage: dev

functions:
  getCurrentlyReading:
    handler: handler.getCurrentlyReading
    events:
      - http:
          path: getCurrentlyReading
          method: get
          cors: true
  getReadBooks:
    handler: handler.getReadBooks
    events:
      - http:
          path: getReadBooks
          method: get
          cors: true
  getAudiobooks:
    handler: handler.getAudiobooks
    events:
      - http:
          path: getAudiobooks
          method: get
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3003
    stageVariables:
      stage: dev
    noPrependStageInUrl: true

# Remove the plugins section and use built-in esbuild
build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - '@playwright/test'
      - 'playwright-core'
    platform: 'node'
    target: 'node18'
    external:
      - 'fsevents'
      - '@playwright/test'
      - 'playwright-core'
